<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>秋の福岡散策手帖 ｜ 5 Days Travel Note</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Zen+Old+Mincho:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #FAF8F5;       /* 和紙暖米白 */
      --card-bg: #FFFFFF;         /* 純淨白底 */
      --text-main: #342E2B;       /* 深褐焙茶灰 */
      --text-muted: #8A817C;      /* 灰褐 */
      --autumn-amber: #C07A4B;    /* 銀杏琥珀 */
      --autumn-terracotta: #8C5338;/* 赤陶茶褐 */
      --autumn-leaf: #E8DCCF;     /* 淺秋葉米 */
      --slate-blue: #3E515B;      /* 深青黛 */
      --border-soft: #EDE6DE;     /* 亞麻線條 */
      --tag-bg: #F3ECE2;          /* 標籤淡雅底色 */
      --accent-green: #6B7B6E;    /* 苔蘚綠 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: 'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, sans-serif;
      padding-bottom: 90px;
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
    }

    /* 雜誌風封面 Header */
    header {
      padding: 38px 24px 22px;
      background-color: var(--bg-canvas);
      border-bottom: 1px solid var(--border-soft);
      position: relative;
    }
    .mag-issue {
      font-family: 'Zen Old Mincho', serif;
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--autumn-amber);
      margin-bottom: 8px;
      font-weight: 600;
    }
    header h1 {
      font-family: 'Zen Old Mincho', 'Noto Serif TC', serif;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-main);
      line-height: 1.3;
    }
    .mag-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      letter-spacing: 0.04em;
    }
    .mag-sub span:last-child {
      font-family: 'Zen Old Mincho', serif;
      font-style: italic;
    }

    /* 頁籤切換：極簡雜誌欄目 */
    nav {
      display: flex;
      margin: 18px 20px 8px;
      border-bottom: 1px solid var(--border-soft);
    }
    nav button {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: none;
      font-family: 'Zen Old Mincho', serif;
      font-size: 0.92rem;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      transition: all 0.25s ease;
    }
    nav button.active {
      color: var(--autumn-terracotta);
      font-weight: 700;
    }
    nav button.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 20%;
      right: 20%;
      height: 2px;
      background-color: var(--autumn-terracotta);
    }

    /* 天數選擇列（滑動標籤） */
    .day-selector {
      display: flex;
      gap: 10px;
      padding: 12px 20px 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .day-selector::-webkit-scrollbar { display: none; }
    .day-pill {
      flex: 0 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .day-pill.active {
      background: var(--autumn-terracotta);
      border-color: var(--autumn-terracotta);
      color: #FFF;
      box-shadow: 0 3px 8px rgba(140, 83, 56, 0.18);
    }

    main { padding: 0 20px; }
    .tab-view { display: none; }
    .tab-view.active { display: block; }

    /* 雜誌排版 Timeline */
    .itinerary-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 6px;
    }
    .plan-card {
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 6px;
      padding: 16px 16px 14px;
      box-shadow: 0 2px 8px rgba(52, 46, 43, 0.02);
      transition: all 0.25s ease;
      position: relative;
    }
    .plan-card.done {
      background: #F4EFEB;
      border-color: #E2D9D0;
      opacity: 0.65;
    }
    .plan-card.done .plan-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .plan-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .time-tag {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      font-family: 'Zen Old Mincho', serif;
      font-weight: 600;
      color: var(--autumn-terracotta);
      background: var(--tag-bg);
      padding: 2px 8px;
      border-radius: 2px;
    }
    .btn-check {
      background: none;
      border: 1px solid var(--border-soft);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: transparent;
      transition: all 0.2s;
    }
    .plan-card.done .btn-check {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: white;
    }
    .plan-title {
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
      letter-spacing: 0.02em;
      line-height: 1.45;
    }
    .plan-note {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.55;
      font-weight: 400;
    }

    /* 開銷手帳（Kakeibo）樣式 */
    .kakeibo-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }
    .kakeibo-box {
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 6px;
      padding: 14px 16px;
      text-align: left;
    }
    .kakeibo-box .lbl {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-family: 'Zen Old Mincho', serif;
      margin-bottom: 4px;
    }
    .kakeibo-box .val {
      font-family: 'Zen Old Mincho', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--autumn-terracotta);
    }

    .rate-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      font-size: 0.74rem;
      color: var(--text-muted);
    }
    .rate-bar input {
      width: 60px;
      padding: 3px 6px;
      border: 1px solid var(--border-soft);
      background: #FFF;
      border-radius: 4px;
      font-size: 0.75rem;
      text-align: center;
    }

    .kakeibo-form {
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 22px;
    }
    .form-title {
      font-family: 'Zen Old Mincho', serif;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      color: var(--slate-blue);
      margin-bottom: 12px;
      font-weight: 600;
    }
    .f-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .f-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .f-group label { font-size: 0.72rem; color: var(--text-muted); letter-spacing: 0.04em; }
    input, select {
      padding: 8px 10px;
      border: 1px solid var(--border-soft);
      border-radius: 4px;
      background: #FAF8F5;
      font-size: 0.82rem;
      color: var(--text-main);
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--autumn-amber);
      background: #FFF;
    }
    .btn-add {
      width: 100%;
      background: var(--autumn-amber);
      color: white;
      border: none;
      padding: 9px;
      font-size: 0.84rem;
      letter-spacing: 0.1em;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 4px;
      font-family: 'Zen Old Mincho', serif;
      transition: background 0.2s;
    }
    .btn-add:hover { background: var(--autumn-terracotta); }

    /* 支出手帳清單 */
    .kakeibo-records {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .record-card {
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      padding: 12px 14px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .rec-main { font-size: 0.88rem; font-weight: 600; color: var(--text-main); }
    .rec-meta { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }
    .rec-right { display: flex; align-items: center; gap: 10px; text-align: right; }
    .rec-twd { font-family: 'Zen Old Mincho', serif; font-size: 0.95rem; font-weight: 700; color: var(--text-main); }
    .rec-jpy { font-size: 0.72rem; color: var(--text-muted); }
    .btn-del {
      border: none;
      background: none;
      color: #B5A89E;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 2px 4px;
    }
    .btn-del:hover { color: #E74C3C; }
  </style>
</head>
<body>

  <!-- 封面 Header -->
  <header>
    <div class="mag-issue">Travel Note 01 ｜ Autumn Leaves</div>
    <h1>福岡秋日散策手帖</h1>
    <div class="mag-sub">
      <span>2026.10.16 – 10.20</span>
      <span>Hakata & Beyond</span>
    </div>
  </header>

  <!-- 雜誌雙欄導航 -->
  <nav>
    <button class="active" onclick="switchMagazineTab('itinerary')">日程編排 ． Plan</button>
    <button onclick="switchMagazineTab('kakeibo')">旅費手帳 ． Expense</button>
  </nav>

  <!-- 內容區 1：行程列表 -->
  <main id="itinerary-view" class="tab-view active">
    <div class="day-selector">
      <div class="day-pill active" onclick="pickDay(1)">Day 1 ． 初見博多</div>
      <div class="day-pill" onclick="pickDay(2)">Day 2 ． 水岸與選物</div>
      <div class="day-pill" onclick="pickDay(3)">Day 3 ． 柳川與太宰府</div>
      <div class="day-pill" onclick="pickDay(4)">Day 4 ． 街區巡禮</div>
      <div class="day-pill" onclick="pickDay(5)">Day 5 ． 歸途漫步</div>
    </div>

    <div class="itinerary-list" id="plan-container">
      <!-- 由 JS 動態生成 -->
    </div>
  </main>

  <!-- 內容區 2：記帳手帳 -->
  <main id="kakeibo-view" class="tab-view">
    <div class="kakeibo-stats">
      <div class="kakeibo-box">
        <div class="lbl">TOTAL TWD 總支出</div>
        <div class="val" id="sum-twd">NT$ 0</div>
      </div>
      <div class="kakeibo-box">
        <div class="lbl">TOTAL JPY 日幣換算</div>
        <div class="val" id="sum-jpy">¥ 0</div>
      </div>
    </div>

    <div class="rate-bar">
      <span>參考匯率 (JPY ➔ TWD):</span>
      <input type="number" id="current-rate" step="0.001" value="0.215" onchange="adjustRate()">
    </div>

    <!-- 登記卡片 -->
    <div class="kakeibo-form">
      <div class="form-title">／ 記錄新消費 ． Entry ／</div>
      <div class="f-row">
        <div class="f-group" style="flex: 2;">
          <label>支出名目</label>
          <input type="text" id="k-item" placeholder="如：とめ手羽 雞翅居酒屋">
        </div>
        <div class="f-group" style="flex: 1;">
          <label>幣別</label>
          <select id="k-curr">
            <option value="JPY">日圓 (¥)</option>
            <option value="TWD">台幣 ($)</option>
          </select>
        </div>
      </div>

      <div class="f-row">
        <div class="f-group">
          <label>金額</label>
          <input type="number" id="k-amount" placeholder="0">
        </div>
        <div class="f-group">
          <label>分類</label>
          <select id="k-type">
            <option value="餐飲飲食">餐飲飲食</option>
            <option value="交通移動">交通移動</option>
            <option value="生活雜貨">生活雜貨</option>
            <option value="景點體驗">景點體驗</option>
            <option value="住宿費用">住宿費用</option>
            <option value="其他花費">其他花費</option>
          </select>
        </div>
        <div class="f-group">
          <label>付款方式</label>
          <select id="k-payment">
            <option value="現金">現金</option>
            <option value="信用卡">信用卡</option>
            <option value="交通IC卡">交通IC卡</option>
          </select>
        </div>
      </div>
      <button class="btn-add" onclick="saveRecord()">記帳 ． RECORD</button>
    </div>

    <!-- 記錄明細 -->
    <div class="kakeibo-records" id="kakeibo-records-box">
      <!-- 動態載入記錄 -->
    </div>
  </main>

  <script>
    // 完整 5 天行程資料庫
    const itineraryPlans = {
      1: [
        { time: "08:00 – 11:20", title: "台北出發 ➔ 抵達福岡 (長榮 BR 106)", note: "飛抵福岡國際線航廈，領取行李。" },
        { time: "11:20 – 12:30", title: "通關入境 ➔ 接駁巴士至國內線轉地鐵", note: "搭乘地下鐵空港線直達博多站（約 5 分鐘）。" },
        { time: "12:30 – 13:15", title: "飯店寄放行李 ＆ 隨身整備", note: "博多車站周邊飯店寄存行李，換上輕便隨身包。" },
        { time: "13:15 – 14:30", title: "【午餐時段】博多車站地下街用餐", note: "一番街或 DEITOS 暖胃拉麵或烤魚定食。" },
        { time: "14:30 – 15:30", title: "參拜博多總鎮守「櫛田神社」", note: "白天參拜、近距離欣賞巨型常設飾山笠與夫婦銀杏樹。" },
        { time: "15:30 – 16:45", title: "漫步「川端通商店街」", note: "出神社北口即是，挑高拱廊遮蔭，逛老舖雜貨與紅豆麻糬湯。" },
        { time: "16:45 – 17:00", title: "中洲川端站搭地鐵直達回博多站", note: "僅 2 站 3 分鐘回到博多，動線零折返。" },
        { time: "17:00 – 18:30", title: "【飯店 Check-in 徹底休息】", note: "進房放行囊、洗臉小憩充電，消解早班機勞頓。" },
        { time: "18:30 – 20:00", title: "【晚餐時段】博多車站周邊美食", note: "推薦前往「とめ手羽」品嚐金賞酥脆炸雞翅居酒屋。" },
        { time: "20:00 – 20:40", title: "【高空夜景】JR 博多城頂樓「燕之杜廣場」", note: "搭乘透明電梯直達屋頂層，俯瞰大通車流光軌、遠眺飛機航道。" },
        { time: "20:40 – 21:20", title: "【綠洲散策】明治公園立體迴廊（藤本壯介監修）", note: "下樓漫步 3 分鐘即達，登上空之庭平台吹秋風，外帶 POSS COFFEE 熱飲。" },
        { time: "21:20 之後", title: "漫步返回飯店休息", note: "步行 3 分鐘回飯店，泡澡放鬆就寢。" }
      ],
      2: [
        { time: "09:00 – 11:30", title: "百道濱沙灘 ＆ 福岡塔", note: "【方案A安心首選】西新站出站漫步海螺小姐通林蔭道（1.4km約20分）直達福岡塔。<br>【方案B微風兜風】租借 Charichari 電輔車沿專用道騎乘。" },
        { time: "11:30 – 11:45", title: "移動至「大濠公園站」", note: "福岡塔下搭巴士或西新站搭地鐵直達。" },
        { time: "11:45 – 13:00", title: "【午餐時段】大濠公園水岸周邊", note: "湖畔景觀咖啡或周邊特色餐廳享用午餐。" },
        { time: "13:00 – 14:15", title: "大濠公園湖畔 ＆ 舞鶴公園福岡城跡石垣", note: "湖畔散策、登上城跡天守台眺望福岡市區開闊天際線。" },
        { time: "14:15 – 17:00", title: "「藥院」質感生活街區散策", note: "逛訪巷弄生活雜貨、品嚐法式舒芙蕾等手作下午茶。" },
        { time: "17:00 – 18:30", title: "天神大名潮流街區 ＆ 警固神社足湯", note: "大名潮流店鋪漫步，於警固神社享受免費溫泉足湯放鬆雙腳。" },
        { time: "18:30 – 20:00", title: "【晚餐時段】天神／今泉商圈周邊", note: "享用在地博多牛腸鍋或特色居酒屋。" },
        { time: "20:00 之後", title: "天神站搭地鐵回博多飯店", note: "地鐵 3 站即達博多，輕鬆休息。" }
      ],
      3: [
        { time: "08:15 – 09:37", title: "博多 ➔ 西鐵天神搭特急直達「西鐵柳川站」", note: "清晨直奔最南端，完美避開觀光團潮。" },
        { time: "09:45 – 11:00", title: "柳川水鄉遊船（川下り）", note: "清晨在柳樹石橋下泛舟漫遊約 60 分鐘。" },
        { time: "11:15 – 12:45", title: "【午餐時段】柳川沖端老街蒸籠鰻魚飯", note: "品嚐炭火現烤熱騰騰的招牌蒸籠鰻魚飯。" },
        { time: "13:00 – 14:15", title: "西鐵北上至二日市轉乘至「太宰府站」", note: "西鐵同站轉乘太宰府線，轉銜流暢無阻。" },
        { time: "14:15 – 16:30", title: "參拜太宰府天滿宮 ＆ 表參道散策", note: "欣賞漂浮森林假殿、隈研吾星巴克、吃現烤熱梅枝餅。" },
        { time: "16:30 – 17:30", title: "西鐵藥院站轉乘七隈線至天神南站", note: "同站換線，避開天神大站人潮。" },
        { time: "17:30 – 18:30", title: "天神中央公園 ＆ 舊公會堂貴賓館夜燈", note: "明治法式木造貴賓館與水岸微風漫步。" },
        { time: "18:30 – 20:00", title: "【晚餐時段】天神南／春吉／中洲屋台", note: "體驗道地路邊屋台文化或水岸景觀美食。" },
        { time: "20:00 之後", title: "天神南站搭七隈線回博多站", note: "僅 2 站直達博多站飯店。" }
      ],
      4: [
        { time: "09:30 – 12:30", title: "LaLaPort 福岡 朝聖實體大 ν 鋼彈", note: "博多搭巴士直達，朝聖巨大鋼彈聲光演出與商場逛街。" },
        { time: "12:30 – 14:00", title: "返回天神商圈 ＆【午餐時段】", note: "天神周邊自由享用天婦羅或炸牛排。" },
        { time: "14:00 – 17:00", title: "天神商圈平日集中採買", note: "天神地下街、Mina天神、大名服飾，週一人潮少退稅極快。" },
        { time: "17:00 – 18:30", title: "搭七隈線至博多運河城賞水舞", note: "欣賞整點音樂水舞秀、逛大型 Alpen 戶外用品店。" },
        { time: "18:30 – 19:30", title: "漫步回博多車站 ＆ 阪急 B1 伴手禮補齊", note: "一次買足福岡各大盒裝排隊名產。" },
        { time: "19:30 – 21:00", title: "【晚餐時段】博多車站周邊豐盛晚餐", note: "旅程最後一晚大餐自由挑選。" },
        { time: "21:00 之後", title: "回飯店整理行李箱", note: "分類打包托運品、秤重準備回國。" }
      ],
      5: [
        { time: "08:00 – 08:30", title: "飯店退房，攜帶行李至博多車站", note: "行李直接推至車站地下街。" },
        { time: "08:30 – 09:30", title: "【早午餐與咖啡時段】博多車站悠閒朝食", note: "站內自由挑選心儀早餐，慢慢喝杯手沖咖啡醒腦。" },
        { time: "09:30 – 09:40", title: "博多站搭地鐵空港線至國內線航廈", note: "僅 2 站約 5 分鐘，出站即是國內線航廈 B2。" },
        { time: "09:40 – 10:20", title: "【國內線航廈漫步】展望台看飛機 ＆ 特產街", note: "頂樓露天展望台近距離看客機起降、逛開闊特產街。" },
        { time: "10:20 – 10:35", title: "國內線搭乘免費接駁車前往國際線", note: "班次密集，車程約 10～15 分鐘輕鬆抵達。" },
        { time: "10:35 – 12:20", title: "長榮櫃檯報到 ➔ 出境安檢 ➔ 免稅店採買", note: "悠閒託運行李出境，免稅店補齊伴手禮。" },
        { time: "12:20 – 13:45", title: "搭乘長榮航空 BR 105 起飛返台", note: "平安順利降落台北桃園機場！" }
      ]
    };

    let activeDay = 1;
    let rate = parseFloat(localStorage.getItem('fk_rate')) || 0.215;
    let records = JSON.parse(localStorage.getItem('fk_records')) || [];
    let completed = JSON.parse(localStorage.getItem('fk_done_tasks')) || {};

    document.getElementById('current-rate').value = rate;

    // 分頁切換
    function switchMagazineTab(tab) {
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
      if(tab === 'itinerary') {
        event.target.classList.add('active');
        document.getElementById('itinerary-view').classList.add('active');
      } else {
        event.target.classList.add('active');
        document.getElementById('kakeibo-view').classList.add('active');
        drawRecords();
      }
    }

    // 切換天數
    function pickDay(d) {
      activeDay = d;
      document.querySelectorAll('.day-pill').forEach((p, idx) => {
        p.classList.toggle('active', idx + 1 === d);
      });
      drawPlans();
    }

    // 渲染行程卡片
    function drawPlans() {
      const container = document.getElementById('plan-container');
      const plans = itineraryPlans[activeDay] || [];
      container.innerHTML = plans.map((p, idx) => {
        const taskId = `day_${activeDay}_${idx}`;
        const isDone = completed[taskId] ? 'done' : '';
        return `
          <div class="plan-card ${isDone}">
            <div class="plan-meta">
              <span class="time-tag">${p.time}</span>
              <button class="btn-check" onclick="togglePlan('${taskId}')">✓</button>
            </div>
            <div class="plan-title">${p.title}</div>
            <div class="plan-note">${p.note}</div>
          </div>
        `;
      }).join('');
    }

    function togglePlan(id) {
      completed[id] = !completed[id];
      localStorage.setItem('fk_done_tasks', JSON.stringify(completed));
      drawPlans();
    }

    // 匯率
    function adjustRate() {
      rate = parseFloat(document.getElementById('current-rate').value) || 0.215;
      localStorage.setItem('fk_rate', rate);
      drawRecords();
    }

    // 儲存消費
    function saveRecord() {
      const name = document.getElementById('k-item').value.trim();
      const amount = parseFloat(document.getElementById('k-amount').value);
      const curr = document.getElementById('k-curr').value;
      const type = document.getElementById('k-type').value;
      const pay = document.getElementById('k-payment').value;

      if(!name || isNaN(amount) || amount <= 0) {
        alert('請填入項目名稱與正確金額');
        return;
      }

      let twd, jpy;
      if (curr === 'JPY') {
        jpy = Math.round(amount);
        twd = Math.round(amount * rate);
      } else {
        twd = Math.round(amount);
        jpy = Math.round(amount / rate);
      }

      const entry = {
        id: Date.now(),
        name, twd, jpy, type, pay,
        date: new Date().toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit' })
      };

      records.unshift(entry);
      localStorage.setItem('fk_records', JSON.stringify(records));

      document.getElementById('k-item').value = '';
      document.getElementById('k-amount').value = '';
      drawRecords();
    }

    function removeRecord(id) {
      records = records.filter(r => r.id !== id);
      localStorage.setItem('fk_records', JSON.stringify(records));
      drawRecords();
    }

    // 渲染手帳記錄
    function drawRecords() {
      let totalTwd = 0;
      let totalJpy = 0;
      const box = document.getElementById('kakeibo-records-box');

      if (records.length === 0) {
        box.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 30px 0; font-size: 0.8rem; font-family: 'Zen Old Mincho', serif;">尚無消費記錄 ． 請記錄下第一筆旅行回憶</div>`;
      } else {
        box.innerHTML = records.map(r => {
          totalTwd += r.twd;
          totalJpy += r.jpy;
          return `
            <div class="record-card">
              <div>
                <div class="rec-main">${r.name}</div>
                <div class="rec-meta">${r.date} ． ${r.type} ． ${r.pay}</div>
              </div>
              <div class="rec-right">
                <div>
                  <div class="rec-twd">NT$ ${r.twd.toLocaleString()}</div>
                  <div class="rec-jpy">¥ ${r.jpy.toLocaleString()}</div>
                </div>
                <button class="btn-del" onclick="removeRecord(${r.id})">✕</button>
              </div>
            </div>
          `;
        }).join('');
      }

      document.getElementById('sum-twd').innerText = `NT$ ${totalTwd.toLocaleString()}`;
      document.getElementById('sum-jpy').innerText = `¥ ${totalJpy.toLocaleString()}`;
    }

    // 初始渲染
    drawPlans();
    drawRecords();
  </script>
</body>
</html>
